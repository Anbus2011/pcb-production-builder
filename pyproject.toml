[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panelcheck"
version = "0.1.0"
description = "Gerber + pick-and-place overlay and verification tool"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.7",
    "gerbonara>=1.6,<2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyinstaller>=6.6",
]

[project.scripts]
panelcheck = "panelcheck.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # gerbonara warns about Altium's deprecated G70 (inch) statement on every file
    "ignore::DeprecationWarning:gerbonara",
    "ignore::SyntaxWarning:gerbonara",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["testdata"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]
